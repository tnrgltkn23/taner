<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uzman Hedef Takip — Giriş</title>
  <link rel="icon" type="image/png" href="/img/favicon-64.png"><link rel="apple-touch-icon" href="/img/apple-touch-180.png">
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap"><img class="hero-mascot" src="/portal/mascot-right.webp" alt="" aria-hidden="true">
    <div class="card login-card">
      <img class="login-logo" src="/img/taner-eren-logo.png" alt="Taner &amp; Eren" width="140" height="140">
      <div class="row" style="justify-content:center">
        <h1 style="color:var(--navy);font-size:18px">Uzman Hedef Takip</h1>
        <span id="env" class="env-badge hidden"></span>
      </div>

      <div class="seg" role="tablist">
        <button type="button" class="active" data-mode="user">Kullanıcı Girişi</button>
        <button type="button" data-mode="admin">Yönetici Girişi</button>
      </div>

      <form id="user-form" class="stack" autocomplete="on">
        <label class="field"><span class="label-navy">Kullanıcı Adı :</span>
          <input type="text" id="u-name" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" required>
        </label>
        <label class="field"><span class="label-navy">Şifre :</span>
          <input type="password" id="u-pass" inputmode="numeric" autocomplete="current-password" maxlength="5" pattern="\d{5}" required>
        </label>
        <button class="btn green" type="submit" id="u-submit">Giriş</button>
      </form>

      <form id="admin-form" class="stack hidden">
        <label class="field"><span class="label-navy">Yönetici Şifresi :</span>
          <input type="password" id="a-pass" autocomplete="current-password" required>
        </label>
        <button class="btn green" type="submit" id="a-submit">Giriş</button>
      </form>

      <p id="msg" class="small" style="margin:12px 0 0;color:var(--red);min-height:1.2em"></p>
    </div>
  </div>
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
